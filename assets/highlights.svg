<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <clipPath id="clip"><rect width="1200" height="120" rx="12"/></clipPath>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#21262D"/></pattern>
  
</defs>
<style>
  .in{animation:in .7s ease-out both}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .soft{animation:soft 2.4s ease-in-out infinite}
  @keyframes soft{50%{opacity:.35}}</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="120" fill="#0D1117"/>

    <g class="in" style="animation-delay:0.10s">
      <text x="40" y="60" font-size="26" font-weight="600" letter-spacing="-.6" fill="#E6EDF3">30+ agents</text>
      <text x="40" y="88" font-size="13.5" fill="#8B949E">One router, specialist agents</text>
    </g><line x1="300" y1="28" x2="300" y2="92" stroke="#21262D"/>
    <g class="in" style="animation-delay:0.17s">
      <text x="340" y="60" font-size="26" font-weight="600" letter-spacing="-.6" fill="#E6EDF3">300+ tools</text>
      <text x="340" y="88" font-size="13.5" fill="#8B949E">MCP · 15+ business modules</text>
    </g><line x1="600" y1="28" x2="600" y2="92" stroke="#21262D"/>
    <g class="in" style="animation-delay:0.24s">
      <text x="640" y="60" font-size="26" font-weight="600" letter-spacing="-.6" fill="#E6EDF3">8 repos</text>
      <text x="640" y="88" font-size="13.5" fill="#8B949E">AI review on every PR into main</text>
    </g><line x1="900" y1="28" x2="900" y2="92" stroke="#21262D"/>
    <g class="in" style="animation-delay:0.31s">
      <text x="940" y="60" font-size="26" font-weight="600" letter-spacing="-.6" fill="#E6EDF3">DFC Flow</text>
      <text x="940" y="88" font-size="13.5" fill="#8B949E">AI Team Lead · since Mar 2026</text>
    </g>
</g>
<rect x=".5" y=".5" width="1199" height="119" rx="12" fill="none" stroke="#21262D"/>
</svg>
