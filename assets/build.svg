<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="456" viewBox="0 0 1200 456" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <clipPath id="clip"><rect width="1200" height="456" rx="12"/></clipPath>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#21262D"/></pattern>
  
</defs>
<style>
  .in{animation:in .7s ease-out both}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .soft{animation:soft 2.4s ease-in-out infinite}
  @keyframes soft{50%{opacity:.35}}</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="456" fill="#0D1117"/>
<g class="in" style="animation-delay:0.10s">
      <rect x="24" y="24" width="370.67" height="196" rx="10" fill="#111722" stroke="#30363D"/>
      <rect x="48" y="48" width="66" height="28" rx="6" fill="#0D1117" stroke="#30363D"/>
      <text x="81" y="67" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#58A6FF" text-anchor="middle">AGENT</text>
      <text x="48" y="122" font-size="22" font-weight="600" fill="#E6EDF3">Multi-agent Chatbot</text>
      <text x="48" y="158" font-size="16.5" fill="#8B949E">One router over 30+ specialist agents and</text>
      <text x="48" y="183" font-size="16.5" fill="#8B949E">300+ tools; humans approve the writes.</text>
    </g><g class="in" style="animation-delay:0.17s">
      <rect x="414.67" y="24" width="370.67" height="196" rx="10" fill="#111722" stroke="#30363D"/>
      <rect x="438.67" y="48" width="48" height="28" rx="6" fill="#0D1117" stroke="#30363D"/>
      <text x="462.67" y="67" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#58A6FF" text-anchor="middle">MCP</text>
      <text x="438.67" y="122" font-size="22" font-weight="600" fill="#E6EDF3">MCP Tool Layer</text>
      <text x="438.67" y="158" font-size="16.5" fill="#8B949E">Chat tools mirror the MCP server across</text>
      <text x="438.67" y="183" font-size="16.5" fill="#8B949E">18 business modules, built in 11 waves.</text>
    </g><g class="in" style="animation-delay:0.24s">
      <rect x="805.33" y="24" width="370.67" height="196" rx="10" fill="#111722" stroke="#30363D"/>
      <rect x="829.33" y="48" width="57" height="28" rx="6" fill="#0D1117" stroke="#30363D"/>
      <text x="857.83" y="67" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#58A6FF" text-anchor="middle">PROD</text>
      <text x="829.33" y="122" font-size="22" font-weight="600" fill="#E6EDF3">Root-cause Tracing</text>
      <text x="829.33" y="158" font-size="16.5" fill="#8B949E">A chat turn hung for 7,900 s. Traced it to</text>
      <text x="829.33" y="183" font-size="16.5" fill="#8B949E">silently dropped DB connections; bounded.</text>
    </g><g class="in" style="animation-delay:0.31s">
      <rect x="24" y="240" width="370.67" height="196" rx="10" fill="#111722" stroke="#30363D"/>
      <rect x="48" y="264" width="57" height="28" rx="6" fill="#0D1117" stroke="#30363D"/>
      <text x="76.5" y="283" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#58A6FF" text-anchor="middle">COST</text>
      <text x="48" y="338" font-size="22" font-weight="600" fill="#E6EDF3">Prompt Caching</text>
      <text x="48" y="374" font-size="16.5" fill="#8B949E">Cached input tokens: 0% → 80%, by moving</text>
      <text x="48" y="399" font-size="16.5" fill="#8B949E">a per-turn block out of the system prompt.</text>
    </g><g class="in" style="animation-delay:0.38s">
      <rect x="414.67" y="240" width="370.67" height="196" rx="10" fill="#111722" stroke="#30363D"/>
      <rect x="438.67" y="264" width="40" height="28" rx="6" fill="#0D1117" stroke="#30363D"/>
      <text x="458.67" y="283" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#58A6FF" text-anchor="middle">QA</text>
      <text x="438.67" y="338" font-size="22" font-weight="600" fill="#E6EDF3">Quality Gates</text>
      <text x="438.67" y="374" font-size="16.5" fill="#8B949E">AI review gates every merge; Playwright</text>
      <text x="438.67" y="399" font-size="16.5" fill="#8B949E">load runs replay 24 chat turns per round.</text>
    </g><g class="in" style="animation-delay:0.45s">
      <rect x="805.33" y="240" width="370.67" height="196" rx="10" fill="#111722" stroke="#30363D"/>
      <rect x="829.33" y="264" width="40" height="28" rx="6" fill="#0D1117" stroke="#30363D"/>
      <text x="849.33" y="283" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#58A6FF" text-anchor="middle">CV</text>
      <text x="829.33" y="338" font-size="22" font-weight="600" fill="#E6EDF3">Pet Recognition</text>
      <text x="829.33" y="374" font-size="16.5" fill="#8B949E">YOLOv11 detection and MobileNetV2</text>
      <text x="829.33" y="399" font-size="16.5" fill="#8B949E">fur-color classification — 87% accuracy.</text>
    </g>
</g>
<rect x=".5" y=".5" width="1199" height="455" rx="12" fill="none" stroke="#21262D"/>
</svg>
