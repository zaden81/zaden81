<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <clipPath id="clip"><rect width="1200" height="110" rx="12"/></clipPath>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#21262D"/></pattern>
  
</defs>
<style>
  .in{animation:in .7s ease-out both}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .soft{animation:soft 2.4s ease-in-out infinite}
  @keyframes soft{50%{opacity:.35}}</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="110" fill="#0D1117"/>

  <g class="in">
    <text x="600" y="50" font-size="17" fill="#C9D1D9" text-anchor="middle">From zero to deployed — AI that actually works.</text>
    <text x="600" y="78" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="12" fill="#6E7681" text-anchor="middle" letter-spacing=".5">Nguyen Hoai Thuong  ·  hoaithuong81.id.vn  ·  github.com/zaden81</text>
  </g>
</g>
<rect x=".5" y=".5" width="1199" height="109" rx="12" fill="none" stroke="#21262D"/>
</svg>
