    <line x1="690" y1="84" x2="1140" y2="84" stroke="#21262D"/>
    <circle cx="710" cy="65" r="5" fill="#30363D"/><circle cx="728" cy="65" r="5" fill="#30363D"/><circle cx="746" cy="65" r="5" fill="#30363D"/>
    <text x="915" y="70" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="12" fill="#6E7681" text-anchor="middle">about.py</text>
