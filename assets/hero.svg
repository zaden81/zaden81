      <text x="742" y="218" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14"><tspan fill="#79C0FF">&#160;&#160;"stack"</tspan><tspan fill="#8B949E">:&#160;[</tspan><tspan fill="#A5D6FF">"Python"</tspan><tspan fill="#8B949E">,&#160;</tspan><tspan fill="#A5D6FF">"TS"</tspan><tspan fill="#8B949E">,&#160;</tspan><tspan fill="#A5D6FF">"LangGraph"</tspan><tspan fill="#8B949E">],</tspan></text></g><g class="in" style="animation-delay:0.85s">
