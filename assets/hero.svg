  <text class="in" style="animation-delay:0.45s" x="48" y="276" font-size="16" fill="#8B949E">I turn AI models into real products — LLM agents, chatbots, MCP tools.</text>

  <g class="in" style="animation-delay:0.55s" font-size="13.5" fill="#8B949E">
