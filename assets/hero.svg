<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <clipPath id="clip"><rect width="1200" height="380" rx="12"/></clipPath>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#21262D"/></pattern>
  <linearGradient id="dg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient>
  <mask id="dm"><rect x="600" width="600" height="380" fill="url(#dg)"/></mask>
</defs>
<style>
  .in{animation:in .7s ease-out both}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .soft{animation:soft 2.4s ease-in-out infinite}
  @keyframes soft{50%{opacity:.35}}</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="380" fill="#0D1117"/>

  <rect x="600" width="600" height="380" fill="url(#dots)" mask="url(#dm)"/>
  <rect x="48" y="0" width="120" height="2" fill="#58A6FF"/>

  <g class="in" style="animation-delay:0.05s">
    <circle cx="56" cy="78" r="4" fill="#3FB950" class="soft"/>
    <text x="70" y="83" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="12.5" letter-spacing="1.2" fill="#8B949E">PERSONAL ACCOUNT · SIDE PROJECTS &amp; EXPERIMENTS</text>
  </g>
  <text class="in" style="animation-delay:0.15s" x="46" y="158" font-size="54" font-weight="700" letter-spacing="-1.6" fill="#E6EDF3">Nguyen Hoai Thuong</text>
