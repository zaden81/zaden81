    <text x="48" y="342"><tspan fill="#6E7681">Company</tspan>  <tspan fill="#C9D1D9">DFC Flow</tspan></text>
    <text x="232" y="342"><tspan fill="#6E7681">Based in</tspan>  <tspan fill="#C9D1D9">Vietnam · UTC+7</tspan></text>
    <text x="448" y="342"><tspan fill="#6E7681">Web</tspan>  <tspan fill="#58A6FF">hoaithuong81.id.vn</tspan></text>
