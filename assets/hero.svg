      <text x="742" y="170" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14"><tspan fill="#79C0FF">&#160;&#160;"company"</tspan><tspan fill="#8B949E">:&#160;</tspan><tspan fill="#A5D6FF">"DFC&#160;Flow"</tspan><tspan fill="#8B949E">,</tspan></text></g><g class="in" style="animation-delay:0.71s">
      <text x="712" y="194" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="12" fill="#484F58" text-anchor="end" dx="12">4</text>
      <text x="742" y="194" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14"><tspan fill="#79C0FF">&#160;&#160;"builds"</tspan><tspan fill="#8B949E">:&#160;[</tspan><tspan fill="#A5D6FF">"Agents"</tspan><tspan fill="#8B949E">,&#160;</tspan><tspan fill="#A5D6FF">"Chatbots"</tspan><tspan fill="#8B949E">,&#160;</tspan><tspan fill="#A5D6FF">"MCP"</tspan><tspan fill="#8B949E">],</tspan></text></g><g class="in" style="animation-delay:0.78s">
