      <text x="682" y="326" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="13.5" fill="#484F58" text-anchor="end" dx="12">8</text>
      <text x="712" y="326" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="16"><tspan fill="#8B949E">}</tspan></text></g>
  <rect class="blink" x="725.6" y="311" width="9" height="19" fill="#58A6FF" opacity=".85"/>
