      <text x="712" y="146" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="12" fill="#484F58" text-anchor="end" dx="12">2</text>
      <text x="742" y="146" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14"><tspan fill="#79C0FF">&#160;&#160;"role"</tspan><tspan fill="#8B949E">:&#160;</tspan><tspan fill="#A5D6FF">"AI&#160;Team&#160;Lead"</tspan><tspan fill="#8B949E">,</tspan></text></g><g class="in" style="animation-delay:0.64s">
