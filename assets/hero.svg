      <text x="742" y="242" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14"><tspan fill="#79C0FF">&#160;&#160;"ship"</tspan><tspan fill="#8B949E">:&#160;[</tspan><tspan fill="#A5D6FF">"Docker"</tspan><tspan fill="#8B949E">,&#160;</tspan><tspan fill="#A5D6FF">"Fly.io"</tspan><tspan fill="#8B949E">,&#160;</tspan><tspan fill="#A5D6FF">"CI"</tspan><tspan fill="#8B949E">],</tspan></text></g><g class="in" style="animation-delay:0.92s">
      <text x="712" y="266" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="12" fill="#484F58" text-anchor="end" dx="12">7</text>
      <text x="742" y="266" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14"><tspan fill="#79C0FF">&#160;&#160;"motto"</tspan><tspan fill="#8B949E">:&#160;</tspan><tspan fill="#A5D6FF">"zero&#160;→&#160;deployed"</tspan><tspan fill="#8B949E">,</tspan></text></g><g class="in" style="animation-delay:0.99s">
      <text x="712" y="290" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="12" fill="#484F58" text-anchor="end" dx="12">8</text>
      <text x="742" y="290" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14"><tspan fill="#8B949E">}</tspan></text></g>
  <rect class="blink" x="754.4" y="277" width="8" height="17" fill="#58A6FF" opacity=".85"/>
</g>
<rect x=".5" y=".5" width="1199" height="379" rx="12" fill="none" stroke="#21262D"/>
