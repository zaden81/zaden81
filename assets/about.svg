<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <clipPath id="clip"><rect width="1200" height="360" rx="12"/></clipPath>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#21262D"/></pattern>
  
</defs>
<style>
  .in{animation:in .7s ease-out both}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .soft{animation:soft 2.4s ease-in-out infinite}
  @keyframes soft{50%{opacity:.35}}</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="360" fill="#0D1117"/>
  <line x1="400" y1="0" x2="400" y2="360" stroke="#21262D"/><line x1="800" y1="0" x2="800" y2="360" stroke="#21262D"/><line x1="0" y1="180" x2="1200" y2="180" stroke="#21262D"/><g class="in" style="animation-delay:0.10s">
      <text x="36" y="50" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="12" fill="#58A6FF">01</text>
      <text x="36" y="84" font-size="18" font-weight="600" fill="#E6EDF3">LLM Agents</text>
      <text x="36" y="116" font-size="14" fill="#8B949E">Router and specialist agents on LangGraph,</text>
      <text x="36" y="138" font-size="14" fill="#8B949E">with prompts, tools and human approvals.</text>
    </g><g class="in" style="animation-delay:0.17s">
      <text x="436" y="50" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="12" fill="#58A6FF">02</text>
      <text x="436" y="84" font-size="18" font-weight="600" fill="#E6EDF3">MCP Tooling</text>
      <text x="436" y="116" font-size="14" fill="#8B949E">MCP tools over commerce, CRM and ERP</text>
      <text x="436" y="138" font-size="14" fill="#8B949E">data, so agents act on real records.</text>
    </g><g class="in" style="animation-delay:0.24s">
      <text x="836" y="50" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="12" fill="#58A6FF">03</text>
      <text x="836" y="84" font-size="18" font-weight="600" fill="#E6EDF3">RAG &amp; Chatbots</text>
      <text x="836" y="116" font-size="14" fill="#8B949E">Intent routing, response formatting and</text>
      <text x="836" y="138" font-size="14" fill="#8B949E">retrieval tuned for domain knowledge.</text>
    </g><g class="in" style="animation-delay:0.31s">
      <text x="36" y="230" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="12" fill="#58A6FF">04</text>
      <text x="36" y="264" font-size="18" font-weight="600" fill="#E6EDF3">Computer Vision</text>
      <text x="36" y="296" font-size="14" fill="#8B949E">YOLO detection and CNN classification —</text>
      <text x="36" y="318" font-size="14" fill="#8B949E">data, training and deployment.</text>
    </g><g class="in" style="animation-delay:0.38s">
      <text x="436" y="230" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="12" fill="#58A6FF">05</text>
      <text x="436" y="264" font-size="18" font-weight="600" fill="#E6EDF3">Fullstack Web</text>
      <text x="436" y="296" font-size="14" fill="#8B949E">FastAPI and Node.js backends, Next.js</text>
      <text x="436" y="318" font-size="14" fill="#8B949E">and TypeScript dashboards.</text>
    </g><g class="in" style="animation-delay:0.45s">
      <text x="836" y="230" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="12" fill="#58A6FF">06</text>
      <text x="836" y="264" font-size="18" font-weight="600" fill="#E6EDF3">Reliability &amp; Quality</text>
      <text x="836" y="296" font-size="14" fill="#8B949E">Root-cause tracing in production,</text>
      <text x="836" y="318" font-size="14" fill="#8B949E">end-to-end tests, automated review.</text>
    </g>
</g>
<rect x=".5" y=".5" width="1199" height="359" rx="12" fill="none" stroke="#21262D"/>
</svg>
